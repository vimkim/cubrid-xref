[project]
name = "cubrid-xref"
version = "0.1.0"
description = "Bidirectional lookup and caching CLI between CUBRID GitHub PRs (engine + TC private/public) and JIRA issues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cubrid-xref = "cubrid_xref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cubrid_xref"]
